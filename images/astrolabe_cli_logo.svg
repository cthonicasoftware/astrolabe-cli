<svg width="100%" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg">
<style>
:root{--b:#7A5A12;--wm:#18140F}
@media(prefers-color-scheme:dark){:root{--b:#D4A03C;--wm:#EDE8DE}}
.r{fill:none;stroke:var(--b);stroke-width:1.5}
.rt{fill:none;stroke:var(--b);stroke-width:0.85}
.rd{fill:none;stroke:var(--b);stroke-width:0.65;stroke-dasharray:4 3}
.tmaj{fill:none;stroke:var(--b);stroke-width:1.6}
.tmed{fill:none;stroke:var(--b);stroke-width:1.05}
.tmin{fill:none;stroke:var(--b);stroke-width:0.6}
.arm{fill:none;stroke:var(--b);stroke-width:0.95}
.dot{fill:var(--b)}
.rul{stroke:var(--b)}
</style>

<!-- Astrolabe mark: center (135,135) r=112 -->
