  font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif"
  font-size="36" font-weight="700" letter-spacing="3">ASTROLABE CLI</text>

<!-- Tagline -->
<text x="265" y="151"
  fill="var(--b)"
  font-family="'Courier New',Courier,monospace"
  font-size="10.5" letter-spacing="1.6">CAPTURE  ·  VALIDATE  ·  UPLOAD</text>

<!-- Rule -->
<line x1="265" y1="161" x2="660" y2="161" stroke="var(--b)" stroke-width="0.8"/>

<!-- Attribution -->
<text x="265" y="178"
  fill="var(--b)"
  font-family="'Courier New',Courier,monospace"
  font-size="8" letter-spacing="1.8" opacity="0.55">CTHONICA SOFTWARE LLC</text>
</svg>
