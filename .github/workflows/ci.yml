name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -count=1 -coverprofile=coverage.out $(go list ./... | grep -v internal/tui)

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  perf:
    name: Performance (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run performance-sensitive tests
        run: go test -v -count=1 -tags=perf -run "TestTCP_Throughput|TestFile_LargeFileIngestion" ./internal/sources
