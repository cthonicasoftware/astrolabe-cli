name: CI

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  perf:
    name: Performance (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run performance-sensitive tests
        run: go test -v -count=1 -tags=perf -run "TestTCP_Throughput|TestFile_LargeFileIngestion" ./internal/sources

  build:
    name: Build
    runs-on: ${{ matrix.runs_on }}
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs_on: ubuntu-latest
            cgo_enabled: 0
          - goos: linux
            goarch: arm64
            runs_on: ubuntu-latest
            cgo_enabled: 0
          - goos: darwin
            goarch: amd64
            runs_on: macos-latest
            cgo_enabled: 1
          - goos: darwin
            goarch: arm64
            runs_on: macos-latest
            cgo_enabled: 1
          - goos: windows
            goarch: amd64
            extension: .exe
            runs_on: windows-latest
            cgo_enabled: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags "-s -w" -o astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }} ./cmd/astrolabe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          retention-days: 7
