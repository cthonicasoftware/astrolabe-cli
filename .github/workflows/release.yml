name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -count=1 ./...

  build:
    name: Build
    runs-on: ${{ matrix.runs_on }}
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            runs_on: ubuntu-latest
            cgo_enabled: 0
          - goos: linux
            goarch: arm64
            archive: tar.gz
            runs_on: ubuntu-latest
            cgo_enabled: 0
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            runs_on: macos-latest
            cgo_enabled: 1
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            runs_on: macos-latest
            cgo_enabled: 1
          - goos: windows
            goarch: amd64
            archive: zip
            extension: .exe
            runs_on: windows-latest
            cgo_enabled: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PKG="github.com/cthonicasoftware/astrolabe-cli/cmd/astrolabe/root"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${GIT_COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}"

          BINARY_NAME="astrolabe"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="astrolabe.exe"
          fi

          go build -ldflags "${LDFLAGS}" -o ${BINARY_NAME} ./cmd/astrolabe

          # Create archive
          ARCHIVE_NAME="astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czvf ${ARCHIVE_NAME}.tar.gz ${BINARY_NAME}
          else
            powershell -NoProfile -Command "Compress-Archive -Path '${BINARY_NAME}' -DestinationPath '${ARCHIVE_NAME}.zip' -Force"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}
          path: astrolabe-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum astrolabe-* > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Astrolabe ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
          files: |
            dist/astrolabe-linux-amd64.tar.gz
            dist/astrolabe-linux-arm64.tar.gz
            dist/astrolabe-darwin-amd64.tar.gz
            dist/astrolabe-darwin-arm64.tar.gz
            dist/astrolabe-windows-amd64.zip
            dist/checksums.txt
          body: |
            ## Installation

            ### Linux (AMD64)
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/astrolabe-linux-amd64.tar.gz
            tar -xzf astrolabe-linux-amd64.tar.gz
            chmod +x astrolabe
            sudo mv astrolabe /usr/local/bin/
            ```

            ### Linux (ARM64)
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/astrolabe-linux-arm64.tar.gz
            tar -xzf astrolabe-linux-arm64.tar.gz
            chmod +x astrolabe
            sudo mv astrolabe /usr/local/bin/
            ```

            ### macOS (Intel)
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/astrolabe-darwin-amd64.tar.gz
            tar -xzf astrolabe-darwin-amd64.tar.gz
            chmod +x astrolabe
            sudo mv astrolabe /usr/local/bin/
            ```

            ### macOS (Apple Silicon)
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/astrolabe-darwin-arm64.tar.gz
            tar -xzf astrolabe-darwin-arm64.tar.gz
            chmod +x astrolabe
            sudo mv astrolabe /usr/local/bin/
            ```

            ### Windows
            Download `astrolabe-windows-amd64.zip`, extract, and add to your PATH.

            ## Verify Installation
            ```bash
            astrolabe version
            ```

            ## Checksums
            See `checksums.txt` for SHA256 checksums of all binaries.
