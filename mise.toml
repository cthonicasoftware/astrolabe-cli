[tools]
go = "1.27"

[env]
GOBIN = "{{config_root}}/.bin"
GOCACHE = "{{config_root}}/.gocache"

# Release binaries are built by GoReleaser (.goreleaser.yml), not mise.

# On Windows, `bash` can resolve to WSL and build a Linux binary with WSL's Go,
# so Windows uses the PowerShell twin of ldflags.sh instead.
[tasks.build]
run = 'go build -ldflags "$(bash scripts/ldflags.sh)" -o astrolabe ./cmd/astrolabe'
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1"
description = "Build the astrolabe CLI with version stamping"

[tasks."build:version"]
run = "bash scripts/ldflags.sh"
run_windows = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ldflags.ps1"
description = "Print version ldflags"

[tasks.test]
run = "go test ./..."
description = "Run all tests"

[tasks.cli]
run = "go run ./cmd/astrolabe"
description = "Run the CLI"

[tasks.tui]
run = "go run ./cmd/astrolabe tui"
description = "Run the Bubble Tea TUI demo"

[tasks.fmt]
run = "go fmt ./..."
description = "Format all Go code"

[tasks.vet]
run = "go vet ./..."
description = "Run Go vet static analysis"

[tasks.lint]
run = "go fmt ./... && go vet ./..."
description = "Run formatting and static analysis"
