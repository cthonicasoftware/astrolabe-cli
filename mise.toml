[tools]
go = "1.25.1"

[tasks.build]
run = "go build ./cmd/qa-agent"
description = "Build the qa-agent CLI"

[tasks.test]
run = "go test ./..."
description = "Run all tests"

[tasks.cli]
run = "go run ./cmd/qa-agent"
description = "Run the CLI"

[tasks.tui]
run = "go run ./cmd/qa-agent tui"
description = "Run the Bubble Tea TUI demo (after build)"

[env]
GOBIN = "{{config_root}}/.bin"
GOCACHE = "{{config_root}}/.gocache"
